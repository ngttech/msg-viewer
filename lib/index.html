    <title>Free in-browser .msg viewer</title>
    <meta charset="UTF-8">
    <meta name="description" content="Read .msg file in your browser for free without sending any data to an external server.">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="icon" href="./favicon.ico">
  </head>
  <body data-theme="dark">
    <div id="root">
      <!-- Panel 1: Sidebar -->
      <aside id="sidebar" class="panel">
        <div class="sidebar-header">
          <div class="app-identity">
            <svg class="app-icon" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="var(--accentOrange)">
              <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
            <h1 class="app-title">.msg viewer</h1>
          </div>
          <p class="trust-line">All local, no upload</p>
        </div>

        <div class="sidebar-content">
          <label for="file" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
            </svg>
            Upload .msg file
          </label>
          <input type="file" id="file" name="file" accept=".msg" hidden />
        </div>

        <div class="sidebar-footer">
          <button id="theme-toggle" class="theme-toggle" title="Toggle theme">
            <svg class="theme-icon moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">

            </svg>
            <svg class="theme-icon sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
            </svg>
          </button>
          <div class="footer-links">
            <a class="footer-link" href="https://github.com/molotochok/msg-viewer" target="_blank" rel="noopener">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
              </svg>
              GitHub
            </a>
            <a class="footer-link" href="https://buymeacoffee.com/markian98f" target="_blank" rel="noopener">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M2 21h19v-3H2v3zM20 8H4v10h16V8zm-2 8H6v-6h12v6zM18 1H6C4.9 1 4 1.9 4 3v3h16V3c0-1.1-.9-2-2-2z"/>
              </svg>
              Buy me a coffee
            </a>
          </div>
        </div>
      </aside>

      <!-- Panel 2: Preview List (placeholder for future functionality) -->
      <div id="preview-panel" class="panel">
        <div class="preview-header">
          <div class="preview-tabs">
            <button class="preview-tab active">Focused</button>
            <button class="preview-tab">Other</button>
          </div>
        </div>
        <div id="preview-list" class="preview-list">
          <div class="preview-empty">
            <p>Upload a .msg file to see message previews</p>
          </div>
        </div>
      </div>

      <!-- Panel 3: Reading Pane -->
      <div id="reading-pane" class="panel">
        <div id="msg"></div>
      </div>
    </div>

    <script type="module" src="./scripts/index.ts"></script>
  </body>
